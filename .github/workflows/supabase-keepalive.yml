# Haelt das Supabase-Free-Projekt aktiv: Supabase pausiert Free-Projekte
# nach ~7 Tagen ohne Aktivitaet. Eine kleine REST-Abfrage alle 3 Tage
# zaehlt als Aktivitaet. RLS liefert fuer den Anon-Key ggf. eine leere
# Liste -- das ist egal, entscheidend ist, dass die DB angefragt wird.
name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Beim Einfuegen der Secrets rutschen leicht Leerzeichen,
          # Zeilenumbrueche oder Anfuehrungszeichen mit rein.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d " \t\r\n\"'")
          url=${url%/}
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d " \t\r\n\"'")
          case "$url" in
            https://*) ;;
            *) echo "SUPABASE_URL muss mit https:// beginnen"; exit 1 ;;
          esac
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$url/rest/v1/players?select=id&limit=1" \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key")
          echo "HTTP $status"
          test "$status" = "200"
